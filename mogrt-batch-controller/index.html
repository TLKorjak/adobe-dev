<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>MOGRT Batch Controller</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    background: #1e1e1e;
    color: #ddd;
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 12px;
  }
  h1 {
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 10px 0;
    color: #fff;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .label {
    color: #999;
  }
  .value {
    color: #ddd;
    font-weight: 600;
  }
  div[role="button"] {
    display: inline-block;
    padding: 6px 14px;
    background: #3a3a3a;
    border: 1px solid #4a4a4a;
    border-radius: 4px;
    color: #ddd;
    cursor: pointer;
    text-align: center;
    user-select: none;
  }
  div[role="button"]:hover {
    background: #4a4a4a;
  }
  div[role="button"]:active {
    background: #555;
  }
  #status {
    margin: 10px 0;
    color: #8a8;
    min-height: 14px;
  }
  #results {
    margin-top: 10px;
    padding: 8px;
    background: #141414;
    border: 1px solid #333;
    border-radius: 4px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 180px;
    overflow-y: auto;
    font-family: Menlo, monospace;
    font-size: 10px;
    color: #9c9;
    display: none;
  }
  #controls {
    margin-top: 6px;
    display: none;
  }
  .control-block {
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid #2c2c2c;
  }
  .control-block:last-child {
    border-bottom: none;
  }
  .control-title {
    color: #ccc;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .control-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  input[type="range"] {
    flex: 1;
  }
  input[type="number"] {
    width: 50px;
    background: #2a2a2a;
    color: #ddd;
    border: 1px solid #4a4a4a;
    border-radius: 3px;
    padding: 3px;
  }
  select {
    flex: 1;
    background: #2a2a2a;
    color: #ddd;
    border: 1px solid #4a4a4a;
    border-radius: 3px;
    padding: 4px;
  }
  #showJsonBtn {
    font-size: 10px;
    color: #777;
    cursor: pointer;
    text-decoration: underline;
    margin-top: 8px;
    display: inline-block;
  }
</style>
</head>
<body>
  <h1>MOGRT Batch Controller</h1>
  <div class="row">
    <span class="label">Sequence</span>
    <span class="value" id="seqName">—</span>
  </div>
  <div class="row">
    <span class="label">Selected clips</span>
    <span class="value" id="selCount">—</span>
  </div>
  <div class="row" style="gap:8px;">
    <div role="button" id="refreshBtn">Refresh</div>
    <div role="button" id="scanBtn">Scan Selection</div>
  </div>
  <div id="status"></div>

  <div id="controls">
    <div id="dynamicControls"></div>
  </div>

  <span id="showJsonBtn">show raw scan JSON</span>
  <div id="results"></div>

  <script src="./js/CSInterface.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
